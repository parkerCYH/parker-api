services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parker
      POSTGRES_PASSWORD: parker
      POSTGRES_DB: parker_api
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://parker:parker@postgres:5432/parker_api
      TEST_DATABASE_URL: postgres://parker:parker@postgres:5432/parker_api_test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
