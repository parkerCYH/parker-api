name: pin

# Render 免費方案閒置 15 分鐘會 spin down(票 01)。這個 workflow 定期、機率性地打
# /pin(票 03 新增的專用 endpoint,不記使用頻率、不共用 /health)來降低 spin down
# 的頻率——目標是「減少」不是「消除」,cold start 可以接受。
on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: 依時間窗機率性 ping /pin
        env:
          PIN_BASE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$PIN_BASE_URL" ]; then
            echo "缺少 repo variable RENDER_SERVICE_URL,無法 ping,略過" >&2
            exit 1
          fi

          utc_hour=$(date -u +%-H)
          # 台北時間(UTC+8)00:00-08:00 對應 UTC 16:00(前一天)-24:00,也就是 UTC hour 16-23。
          # 這段時間整段不 ping(票 01 決策)。
          if [ "$utc_hour" -ge 16 ]; then
            echo "目前落在台北時間 00:00-08:00 區間(UTC hour=$utc_hour),整段跳過不 ping。"
            exit 0
          fi

          # 其餘時段:機率性跳過做隨機化,不用到保證間隔 <15 分鐘的程度(票 01 決策)。
          skip_roll=$((RANDOM % 100))
          skip_threshold=30
          if [ "$skip_roll" -lt "$skip_threshold" ]; then
            echo "機率性跳過(roll=$skip_roll < $skip_threshold)。"
            exit 0
          fi

          echo "打 pin endpoint(roll=$skip_roll >= $skip_threshold)。"
          curl -sf --max-time 60 "$PIN_BASE_URL/pin"
